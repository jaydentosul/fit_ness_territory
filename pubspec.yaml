name: fit_ness_territory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.17.0
  cupertino_icons: ^1.0.8
  dio: ^5.0.0
  flutter_polyline_points: ^3.1.0
  geolocator: ^14.0.2

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.6

#  firebase_core: ^4.7.0
#  firebase_auth: ^6.4.0
#  cloud_firestore: ^6.3.0
#  firebase_storage: ^13.4.1

  pedometer: ^4.0.2
  permission_handler: ^12.0.1

  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/auckland_domain_track.png
    - assets/cornwall_park_track.png
    - assets/shakespear_regional_park_track.png
    - assets/waitakere_ranges_track.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
